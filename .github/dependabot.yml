version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # NUnit 4 moves the classic Assert.* API; upgrade deliberately, not via Dependabot.
      - dependency-name: NUnit
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
