name: Publish NuGet

on:
  release:
    types: [published]
  # Manual re-publish (for example if a release run failed). --skip-duplicate makes it safe.
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NUGET_OUTPUT: ${{ github.workspace }}/nuget

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack VerbalExpressions/VerbalExpressions.csproj -c Release -o "$NUGET_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ${{ env.NUGET_OUTPUT }}/*.nupkg

  publish:
    runs-on: ubuntu-latest
    needs: pack
    permissions:
      contents: read
      id-token: write # Required for NuGet Trusted Publishing (OIDC)
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NUGET_OUTPUT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived API key.
      # The matching policy is configured on nuget.org for owner psoholt.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: psoholt

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in $NUGET_OUTPUT/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
